# Unified tornadogenesis configuration (spec-shaped overlay).
# Loaded by storm_dynamics.tornado_config.load_tornadogenesis_config -> StormConfig + diagnostics.
# The tornado is NEVER imposed (impose_vortex must be false); rotation emerges from the equations.

tornadogenesis:
  enabled: true
  impose_vortex: false                 # invariant -- a true value is rejected
  diagnose_mesocyclone: true
  diagnose_tornado_like_vortex: true

device: cpu                            # or gpu (auto CPU fallback)
duration_s: 1.0
dt_max_s: 4.0

domain:
  nx: 64
  ny: 64
  nz: 44
  Lz_m: 15000.0
  z_stretch: 1.05                      # finer near the surface

environment:
  source: sounding                     # sounding | era5 | hrrr | analytic
  hydrostatic_adjustment: true
  calculate_cape: true
  calculate_srh: true
  use_observed_hodograph: true
  coriolis: true

convection:
  initiation: warm_bubble              # warm_bubble | surface_convergence | real_fields
  bubble_theta_amplitude_K: 2.0
  bubble_radius_x_m: 10000
  bubble_radius_y_m: 10000
  bubble_radius_z_m: 1500
  # for initiation: surface_convergence (sustained meso-ascent)
  sustained_forcing: false
  forcing_heat_K_s: 0.006
  forcing_duration_s: 1500

surface:
  drag_enabled: true
  roughness_length_m: 0.1
  sensible_heat_flux: false
  latent_heat_flux: false
  surface_theta_excess_K: 2.0

microphysics:
  enabled: true
  les_model: smagorinsky               # smagorinsky | tke15
  shifted_equilibrium_nucleation: false
  separate_macro_micro_gradients: true

diagnostics:
  vorticity_budget: true
  updraft_helicity: true
  circulation: true
  pressure_deficit: true
  cold_pool: true
  radar_operator: true
  classification: true
  macro_micro_gradient: true

nesting:
  moving_nest: true
  two_way: true                        # fine->coarse feedback (Attempt G: breaks the ~6 m/s ceiling)
  parent_dx_m: 1000
  mesocyclone_dx_m: 333
  tornado_dx_m: 111
